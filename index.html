<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flappy Bird — 3 Levels</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { 
      height: 100%; 
      overflow: hidden; 
      background: #7ec0ee; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      touch-action: manipulation;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }
    #ui { 
      position: absolute; 
      top: env(safe-area-inset-top, 10px); 
      left: 10px; 
      color: #fff; 
      font-size: 20px; 
      z-index: 10; 
      text-shadow: 1px 1px 2px #000; 
    }
    #menu { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.85); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      flex-direction: column; 
      z-index: 100; 
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    }
    #menu.hidden { display: none; }
    #menu h1 { margin: 0 0 24px; font-size: 36px; color: #fff; text-shadow: 2px 2px 4px #000; }
    .diff { 
      margin: 8px; 
      padding: 14px 32px; 
      background: #fff; 
      color: #2c3e50; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 20px; 
      font-weight: 600; 
      transition: all 0.2s; 
      min-width: 180px; 
      -webkit-tap-highlight-color: transparent;
    }
    .diff:hover, .diff.selected { 
      background: #2c3e50; 
      color: #fff; 
      transform: scale(1.05); 
    }
    #startBtn { 
      margin-top: 24px; 
      padding: 16px 48px; 
      font-size: 22px; 
      font-weight: 700; 
      background: #e74c3c; 
      color: #fff; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: all 0.2s; 
      -webkit-tap-highlight-color: transparent;
    }
    #startBtn:hover { 
      background: #c0392b; 
      transform: scale(1.05); 
    }
    #gameOver { 
      position: fixed; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.9); 
      padding: 40px; 
      border-radius: 16px; 
      text-align: center; 
      color: #fff; 
      display: none; 
      z-index: 50; 
      max-width: 90vw;
    }
    #gameOver.show { display: block; }
    #gameOver h2 { margin: 0 0 16px; font-size: 32px; }
    #gameOver p { font-size: 24px; margin: 8px 0; }
    #gameOver button { 
      margin: 8px 4px; 
      padding: 14px 40px; 
      font-size: 20px; 
      background: #27ae60; 
      color: #fff; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      -webkit-tap-highlight-color: transparent;
    }
    #gameOver button.secondary { background: #3498db; }
    .copy-area { 
      margin-top: 16px; 
      padding: 12px; 
      background: rgba(255,255,255,0.1); 
      border-radius: 8px; 
      font-family: monospace; 
      font-size: 18px; 
      user-select: all; 
      -webkit-user-select: all; 
      word-break: break-all;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="ui">Пролетело: <span id="score">0</span></div>
  <div id="menu">
    <h1>Flappy Bird</h1>
    <button class="diff" data-level="easy">Лёгкий</button>
    <button class="diff selected" data-level="medium">Средний</button>
    <button class="diff" data-level="hard">Сложный</button>
    <button id="startBtn">Начать игру</button>
  </div>
  <div id="gameOver">
    <h2>Игра окончена!</h2>
    <p>Пролетело препятствий: <span id="finalScore">0</span></p>
    <p>Уровень: <span id="finalLevel">—</span></p>
    <button id="replayBtn">Играть снова</button>
    <button id="menuBtn" class="secondary">В меню</button>
    <div class="copy-area" id="copyArea" style="display:none;"></div>
  </div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const menu = document.getElementById('menu');
    const startBtn = document.getElementById('startBtn');
    const gameOver = document.getElementById('gameOver');
    const finalScore = document.getElementById('finalScore');
    const finalLevel = document.getElementById('finalLevel');
    const replayBtn = document.getElementById('replayBtn');
    const menuBtn = document.getElementById('menuBtn');
    const copyArea = document.getElementById('copyArea');
    const diffBtns = document.querySelectorAll('.diff');

    function getViewportSize() {
      if (window.visualViewport) {
        return { w: window.visualViewport.width, h: window.visualViewport.height };
      }
      return { w: window.innerWidth, h: window.innerHeight };
    }

    function resize() {
      const v = getViewportSize();
      canvas.width = v.w;
      canvas.height = v.h;
    }
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
    }

    const levels = {
      easy:   { gravity: 0.25, pipeGap: 160, pipeSpeed: 2, pipeFreq: 2000, label: 'Лёгкий' },
      medium: { gravity: 0.45, pipeGap: 130, pipeSpeed: 3, pipeFreq: 1500, label: 'Средний' },
      hard:   { gravity: 0.7,  pipeGap: 100, pipeSpeed: 4, pipeFreq: 1100, label: 'Сложный' }
    };

    let gameState = 'menu';
    let levelKey = 'medium';
    let frames = 0;
    let score = 0;
    let lastPipeTime = 0;
    let animationId = null;

    const bird = {
      x: 80,
      y: 0,
      radius: 20,
      vy: 0,
      jump: -11,
      rotation: 0
    };

    let pipes = [];

    function flap() {
      if (gameState !== 'playing') return;
      bird.vy = bird.jump;
    }

    function onTap(e) {
      e.preventDefault();
      flap();
    }
    canvas.addEventListener('mousedown', onTap);
    canvas.addEventListener('touchstart', onTap, { passive: false });
    document.addEventListener('keydown', (e) => { 
      if (e.code === 'Space' || e.key === ' ') { 
        e.preventDefault(); 
        flap(); 
      } 
    });

    function createPipe() {
      const cfg = levels[levelKey];
      const minY = 80;
      const maxY = canvas.height - cfg.pipeGap - 80;
      if (maxY <= minY) return;
      const centerY = Math.random() * (maxY - minY) + minY;
      pipes.push(
        { x: canvas.width, y: centerY - cfg.pipeGap / 2, passed: false, isTop: true },
        { x: canvas.width, y: centerY + cfg.pipeGap / 2, passed: false, isTop: false }
      );
    }

    function checkCollide() {
      if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) return true;
      for (const p of pipes) {
        const pipeW = 60;
        const pipeH = p.isTop ? p.y : canvas.height - p.y;
        if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeW) {
          if (p.isTop) {
            if (bird.y - bird.radius < p.y) return true;
          } else {
            if (bird.y + bird.radius > p.y) return true;
          }
        }
      }
      return false;
    }

    function update() {
      if (gameState !== 'playing') return;
      frames++;
      const cfg = levels[levelKey];
      bird.vy += cfg.gravity;
      bird.y += bird.vy;
      bird.rotation = Math.max(-0.5, Math.min(0.8, bird.vy * 0.06));
      pipes.forEach(p => p.x -= cfg.pipeSpeed);
      pipes = pipes.filter(p => p.x > -80);
      if (frames * (1000/60) - lastPipeTime > cfg.pipeFreq) {
        createPipe();
        lastPipeTime = frames * (1000/60);
      }
      if (pipes.length === 0) createPipe();
      pipes.forEach(p => {
        if (!p.passed && p.x + 60 < bird.x) {
          p.passed = true;
          if (!p.isTop) {
            score++;
            scoreEl.textContent = score;
          }
        }
      });
      if (checkCollide()) {
        gameState = 'gameover';
        finalScore.textContent = score;
        finalLevel.textContent = levels[levelKey].label;
        gameOver.classList.add('show');
        copyArea.style.display = 'none';
      }
    }

    function render() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#4fc3f7');
      grad.addColorStop(1, '#7ec0ee');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const pipeW = 60;
      pipes.forEach(p => {
        ctx.fillStyle = '#2e7d32';
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 3;
        if (p.isTop) {
          ctx.fillRect(p.x, 0, pipeW, p.y);
          ctx.strokeRect(p.x, 0, pipeW, p.y);
          ctx.fillRect(p.x - 5, p.y - 20, pipeW + 10, 20);
          ctx.strokeRect(p.x - 5, p.y - 20, pipeW + 10, 20);
        } else {
          const h = canvas.height - p.y;
          ctx.fillRect(p.x, p.y, pipeW, h);
          ctx.strokeRect(p.x, p.y, pipeW, h);
          ctx.fillRect(p.x - 5, p.y, pipeW + 10, 20);
          ctx.strokeRect(p.x - 5, p.y, pipeW + 10, 20);
        }
      });

      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fdd835';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(bird.radius * 0.3, -bird.radius * 0.2, bird.radius * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fdd835';
      ctx.beginPath();
      ctx.ellipse(-bird.radius * 0.2, 0, bird.radius * 0.6, bird.radius * 0.35, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText('Пролетело: ' + score, 20, 50);
    }

    function gameLoop() {
      update();
      render();
      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame(level) {
      levelKey = level;
      menu.classList.add('hidden');
      gameOver.classList.remove('show');
      gameState = 'playing';
      score = 0;
      frames = 0;
      lastPipeTime = 0;
      scoreEl.textContent = 0;
      bird.y = canvas.height / 2;
      bird.vy = 0;
      bird.rotation = 0;
      pipes = [];
      createPipe();
      if (animationId) cancelAnimationFrame(animationId);
      gameLoop();
    }

    function showMenu() {
      gameOver.classList.remove('show');
      menu.classList.remove('hidden');
      gameState = 'menu';
      if (animationId) cancelAnimationFrame(animationId);
    }

    function copyPassword() {
      const pwd = 'My-Drop-Site';
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(pwd).then(() => {
          copyArea.textContent = 'Скопировано: ' + pwd;
          copyArea.style.display = 'block';
        }).catch(() => fallbackCopy(pwd));
      } else {
        fallbackCopy(pwd);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { 
        document.execCommand('copy'); 
        copyArea.textContent = 'Скопировано: ' + text;
        copyArea.style.display = 'block';
      } 
      catch { 
        copyArea.textContent = 'Выдели и скопируй: ' + text;
        copyArea.style.display = 'block';
      }
      document.body.removeChild(ta);
    }

    diffBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        diffBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    startBtn.addEventListener('click', () => {
      const selected = document.querySelector('.diff.selected');
      startGame(selected.dataset.level);
    });

    replayBtn.addEventListener('click', () => {
      gameOver.classList.remove('show');
      startGame(levelKey);
    });

    menuBtn.addEventListener('click', showMenu);

    copyArea.addEventListener('click', copyPassword);

    // Show password hint in gameOver when it appears
    const observer = new MutationObserver(() => {
      if (gameOver.classList.contains('show')) {
        copyArea.textContent = 'Пароль Netlify: My-Drop-Site (нажми для копирования)';
        copyArea.style.display = 'block';
      }
    });
    observer.observe(gameOver, { attributes: true, attributeFilter: ['class'] });

    // SINGLE game loop start
    menu.classList.remove('hidden');
    gameLoop();
  </script>
</body>
</html>
