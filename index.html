<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird — 3 Levels</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#7ec0ee; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; touch-action:none; }
    canvas { display:block; }
    #ui { position:absolute; top:10px; left:10px; color:#fff; font-size:20px; z-index:10; text-shadow:1px 1px 2px #000; }
    #menu { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:100; }
    #menu.hidden { display:none; }
    #menu h1 { margin:0 0 24px; font-size:36px; color:#fff; text-shadow:2px 2px 4px #000; }
    .diff { margin:8px; padding:14px 32px; background:#fff; color:#2c3e50; border:none; border-radius:8px; cursor:pointer; font-size:20px; font-weight:600; transition:all 0.2s; min-width:180px; }
    .diff:hover, .diff.selected { background:#2c3e50; color:#fff; transform:scale(1.05); }
    #startBtn { margin-top:24px; padding:16px 48px; font-size:22px; font-weight:700; background:#e74c3c; color:#fff; border:none; border-radius:8px; cursor:pointer; transition:all 0.2s; }
    #startBtn:hover { background:#c0392b; transform:scale(1.05); }
    #gameOver { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); padding:40px; border-radius:16px; text-align:center; color:#fff; display:none; z-index:50; }
    #gameOver.show { display:block; }
    #gameOver h2 { margin:0 0 16px; font-size:32px; }
    #gameOver p { font-size:24px; margin:8px 0; }
    #gameOver button { margin-top:20px; padding:14px 40px; font-size:20px; background:#27ae60; color:#fff; border:none; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="ui">Пролетело: <span id="score">0</span></div>
  <div id="menu">
    <h1>Flappy Bird</h1>
    <button class="diff selected" data-level="easy">Лёгкий</button>
    <button class="diff" data-level="medium">Средний</button>
    <button class="diff" data-level="hard">Сложный</button>
    <button id="startBtn">Начать игру</button>
  </div>
  <div id="gameOver">
    <h2>Игра окончена!</h2>
    <p>Пролетело препятствий: <span id="finalScore">0</span></p>
    <p>Уровень: <span id="finalLevel">—</span></p>
    <button id="replayBtn">Играть снова</button>
  </div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const menu = document.getElementById('menu');
    const startBtn = document.getElementById('startBtn');
    const gameOver = document.getElementById('gameOver');
    const finalScore = document.getElementById('finalScore');
    const finalLevel = document.getElementById('finalLevel');
    const replayBtn = document.getElementById('replayBtn');
    const diffBtns = document.querySelectorAll('.diff');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const levels = {
      easy:   { gravity: 0.25, pipeGap: 160, pipeSpeed: 2, pipeFreq: 2000, label: 'Лёгкий' },
      medium: { gravity: 0.45, pipeGap: 130, pipeSpeed: 3, pipeFreq: 1500, label: 'Средний' },
      hard:   { gravity: 0.7,  pipeGap: 100, pipeSpeed: 4, pipeFreq: 1100, label: 'Сложный' }
    };

    let gameState = 'menu';
    let levelKey = 'medium';
    let frames = 0;
    let score = 0;
    let lastPipeTime = 0;

    const bird = {
      x: 80,
      y: 0,
      radius: 20,
      vy: 0,
      jump: -11,
      rotation: 0
    };

    let pipes = [];

    function flap() {
      if (gameState !== 'playing') return;
      bird.vy = bird.jump;
    }

    // Input handlers
    function onTap(e) {
      e.preventDefault();
      flap();
    }
    canvas.addEventListener('mousedown', onTap);
    canvas.addEventListener('touchstart', onTap, { passive: false });
    document.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); flap(); } });

    function createPipe() {
      const cfg = levels[levelKey];
      const minY = 80;
      const maxY = canvas.height - cfg.pipeGap - 80;
      const centerY = Math.random() * (maxY - minY) + minY;
      pipes.push(
        { x: canvas.width, y: centerY - cfg.pipeGap / 2, passed: false, isTop: true },
        { x: canvas.width, y: centerY + cfg.pipeGap / 2, passed: false, isTop: false }
      );
    }

    function checkCollide() {
      // Floor/ceiling
      if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) return true;
      // Pipes
      for (const p of pipes) {
        const pipeW = 60;
        const pipeH = p.isTop ? p.y : canvas.height - p.y;
        if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeW) {
          if (p.isTop) {
            if (bird.y - bird.radius < p.y) return true;
          } else {
            if (bird.y + bird.radius > p.y) return true;
          }
        }
      }
      return false;
    }

    function update() {
      if (gameState !== 'playing') return;
      frames++;

      // Bird physics
      const cfg = levels[levelKey];
      bird.vy += cfg.gravity;
      bird.y += bird.vy;
      bird.rotation = Math.max(-0.5, Math.min(0.8, bird.vy * 0.06));

      // Pipes movement
      pipes.forEach(p => p.x -= cfg.pipeSpeed);

      // Remove off-screen pipes
      pipes = pipes.filter(p => p.x > -80);

      // Spawn new pipes
      if (frames * (1000/60) - lastPipeTime > cfg.pipeFreq) {
        createPipe();
        lastPipeTime = frames * (1000/60);
      }

      // Initial pipes
      if (pipes.length === 0) createPipe();

      // Score
      pipes.forEach(p => {
        if (!p.passed && p.x + 60 < bird.x) {
          p.passed = true;
          if (!p.isTop) { // Count only bottom pipe to avoid double counting
            score++;
            scoreEl.textContent = score;
          }
        }
      });

      // Collision
      if (checkCollide()) {
        gameState = 'gameover';
        finalScore.textContent = score;
        finalLevel.textContent = levels[levelKey].label;
        gameOver.classList.add('show');
      }
    }

    function render() {
      // Sky
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#4fc3f7');
      grad.addColorStop(1, '#7ec0ee');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Pipes
      const pipeW = 60;
      pipes.forEach(p => {
        const cfg = levels[levelKey];
        ctx.fillStyle = '#2e7d32';
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 3;

        if (p.isTop) {
          // Top pipe
          ctx.fillRect(p.x, 0, pipeW, p.y);
          ctx.strokeRect(p.x, 0, pipeW, p.y);
          // Cap
          ctx.fillRect(p.x - 5, p.y - 20, pipeW + 10, 20);
          ctx.strokeRect(p.x - 5, p.y - 20, pipeW + 10, 20);
        } else {
          // Bottom pipe
          const h = canvas.height - p.y;
          ctx.fillRect(p.x, p.y, pipeW, h);
          ctx.strokeRect(p.x, p.y, pipeW, h);
          // Cap
          ctx.fillRect(p.x - 5, p.y, pipeW + 10, 20);
          ctx.strokeRect(p.x - 5, p.y, pipeW + 10, 20);
        }
      });

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);
      // Body
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fdd835';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Eye
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(bird.radius * 0.3, -bird.radius * 0.2, bird.radius * 0.25, 0, Math.PI * 2);
      ctx.fill();
      // Wing
      ctx.fillStyle = '#fdd835';
      ctx.beginPath();
      ctx.ellipse(-bird.radius * 0.2, 0, bird.radius * 0.6, bird.radius * 0.35, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Score overlay (backup)
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText('Пролетело: ' + score, 20, 50);
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function startGame(level) {
      levelKey = level;
      menu.classList.add('hidden');
      gameOver.classList.remove('show');
      gameState = 'playing';
      score = 0;
      frames = 0;
      lastPipeTime = 0;
      scoreEl.textContent = 0;
      bird.y = canvas.height / 2;
      bird.vy = 0;
      bird.rotation = 0;
      pipes = [];
      createPipe();
      gameLoop();
    }

    // Difficulty buttons
    diffBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        diffBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    startBtn.addEventListener('click', () => {
      const selected = document.querySelector('.diff.selected');
      startGame(selected.dataset.level);
    });

    replayBtn.addEventListener('click', () => {
      gameOver.classList.remove('show');
      startGame(levelKey);
    });

    // Init
    menu.classList.remove('hidden');
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
